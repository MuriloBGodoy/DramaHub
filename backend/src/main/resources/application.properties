spring.application.name=dramahub

# Banco: H2 em arquivo (./data/dramahub.mv.db) por padrao; em producao aponte para Postgres via env:
#   JDBC_DATABASE_URL=jdbc:postgresql://host/db?sslmode=require  DB_USER=...  DB_PASSWORD=...
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/dramahub;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2

# Upload de videos (episodios gerados por IA)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.http.multipart.max-file-size=2GB
spring.http.multipart.max-request-size=2GB

# Pasta onde os videos enviados ficam guardados
dramahub.media-dir=${DRAMAHUB_MEDIA_DIR:./media}
# Origem do frontend em dev (Vite)
dramahub.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
# Codigo de convite para cadastro (vazio = cadastro aberto)
dramahub.invite-code=${INVITE_CODE:}

server.port=${PORT:8080}
server.forward-headers-strategy=native

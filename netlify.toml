# Frontend no Netlify. O backend Java roda em outro host (ex.: Render) e o Netlify
# faz proxy de /api para ele — assim o app fica no mesmo dominio (sem CORS, PWA feliz).
[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  VITE_OUT_DIR = "dist"
  NODE_VERSION = "22"

# Troque pela URL do seu backend
[[redirects]]
  from   = "/api/*"
  to     = "https://SEU-BACKEND.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA: qualquer rota vai para o index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

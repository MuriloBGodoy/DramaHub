# Site estatico no Netlify; dados e login anonimo no Supabase (sem backend proprio).
[build]
  base    = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Chave publicavel: pode ficar no repositorio (o acesso e controlado pelas regras RLS do banco)
  VITE_SUPABASE_URL = "https://yixsqflqdztmrxlticpk.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pjzuZTMMwtgMXndTH9KP_Q_y_Q78RdF"

# SPA: qualquer rota vai para o index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
